name: Regression Guard — block deploys on iter42-50 failure

# Iter51 — This workflow enforces that no deploy proceeds when the critical
# regression suite is broken. Add it as a Required Status Check on your
# `main` branch protection rules.

on:
  push:
    branches: [main, master, production]
  pull_request:
    branches: [main, master, production]
  workflow_dispatch:

jobs:
  regression-guard:
    name: Iter42-50 Regression Suite
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      # The backend suite was written to run inside the Emergent pod, where the
      # repository lives at /app. Roughly forty of the sixty-seven critical
      # suites are source guardrails that read files by absolute path -
      # /app/backend/server.py, /app/frontend/src/pages/Login.jsx and so on - so
      # on a runner they all fail with FileNotFoundError. Reproducing the layout
      # with one symlink keeps those tests exactly as written; rewriting 300+
      # hard-coded paths across 100+ files would be the larger and riskier
      # change, and would diverge from the environment they actually run in.
      - name: Provide the pod-style /app path
        run: |
          if [ -e /app ] || [ -L /app ]; then
            echo "::error::/app already exists on this runner; refusing to replace it." >&2
            ls -ld /app >&2
            exit 1
          fi
          sudo ln -s "$GITHUB_WORKSPACE" /app
          test -f /app/backend/scripts/run_regression.sh

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Plain install. `emergentintegrations` resolves because requirements.txt now
      # declares Emergent's own public package index, so CI installs exactly what
      # the platform image installs — no filtered copy, no CI-only divergence.
      - name: Install backend deps
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          # Test-only. Regression tests read generated PDFs with pypdf and PyMuPDF
          # (imported as `fitz`); nothing the backend serves imports either, so
          # neither belongs in backend/requirements.txt. Note: the package that
          # provides `import fitz` is PyMuPDF - the PyPI project literally named
          # `fitz` is a different, unrelated one.
          pip install pypdf
          pip install PyMuPDF

      # The demo token is how the regression suite authenticates. The platform
      # image supplies it through /app/backend/.env, which does not exist on a
      # runner, so CI mints its own for this job only: a fresh random value, never
      # a real preview token and never a repository secret. Writing it to
      # $GITHUB_ENV makes it available to every later step, which is what both the
      # backend process and pytest need - they must agree on the same value.
      - name: Generate a CI-only demo token
        run: |
          TOKEN="ci-$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$TOKEN"
          echo "DEMO_TOKEN_VALUE=$TOKEN" >> "$GITHUB_ENV"
          echo "IS_PREVIEW_ENV=1" >> "$GITHUB_ENV"
          echo "ENABLE_DEMO_TOKEN=1" >> "$GITHUB_ENV"

      - name: Start backend (background)
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: regression_ci
          CORS_ORIGINS: "*"
          # Empty ON PURPOSE, and there is no real key anywhere in CI. The AI routes
          # check this key FIRST and answer 503 "AI is not configured", so the suite
          # never reaches a live LLM call. The regression tests accept 503 and assert
          # no real AI response, so CI deliberately exercises the not-configured path.
          EMERGENT_LLM_KEY: ""
        run: |
          cd backend
          nohup uvicorn server:app --host 0.0.0.0 --port 8001 > /tmp/uvicorn.log 2>&1 &
          # Wait for the backend to answer
          for i in {1..30}; do
            curl -sf http://localhost:8001/api/auth/health && exit 0 || sleep 1
          done
          echo "Backend failed to start"; cat /tmp/uvicorn.log; exit 1

      - name: Run regression guard
        env:
          BACKEND_URL_INTERNAL: http://localhost:8001
          # Roughly half the suite discovers the base URL from this variable and
          # falls back to /app/frontend/.env, which a runner does not have.
          REACT_APP_BACKEND_URL: http://localhost:8001
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: regression_ci
        run: |
          bash backend/scripts/run_regression.sh

      - name: Run pre-deploy smoke (Trip + Halting E2E)
        env:
          BACKEND_URL: http://localhost:8001
        run: |
          bash backend/scripts/predeploy_check.sh

      - name: Upload deploy-readiness artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-readiness
          path: /tmp/deploy_readiness.json
          if-no-files-found: ignore

      - name: Fail the job on non-zero
        if: failure()
        run: |
          echo "::error::Regression guard blocked this deploy. See the pytest and predeploy_check output above."
          exit 1
