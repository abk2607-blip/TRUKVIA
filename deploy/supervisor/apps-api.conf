; TRUKVIA · Phase 4 · Gate 9h · supervisord program for the NestJS Finance writer.
;
; TEMPLATE — NOT ACTIVE. Like deploy/supervisor/backend-node.conf, the Emergent
; pod's supervisord configuration (/etc/supervisor/conf.d, where the existing
; `backend` / `frontend` programs live) belongs to the platform image and is NOT
; part of this repository. Installing this program is a platform action, and it
; is Gate 9h §6 step 5a — which has NOT been executed.
;
; This is a DIFFERENT application from `backend-node`, which is the read shadow
; and has its own program file. Running one says nothing about the other.
;
; apps/api listens on 127.0.0.1 only. Under Gate 9h its single surface is
; POST /internal/fin/reproject, called by the Python process over loopback with
; the shared internal token; nothing here adds public ingress or routing.
[program:apps-api]
command=/bin/sh /app/deploy/supervisor/run-apps-api.sh
directory=/app/apps/api
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/apps-api.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/apps-api.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
