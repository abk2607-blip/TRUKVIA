name: backend-node

# Phase 2B foundation-only workflow. Scoped strictly to backend-node/.
# Does NOT touch the Python backend, the React frontend, MongoDB, or any
# locked file. Does NOT deploy.

on:
  push:
    branches: [main]
    paths:
      - 'backend-node/**'
      - '.github/workflows/backend-node.yml'
      - 'docs/contracts/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend-node/**'
      - '.github/workflows/backend-node.yml'
      - 'docs/contracts/**'
  workflow_dispatch:

concurrency:
  group: backend-node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend-node

jobs:
  build-and-test:
    name: install / lint / typecheck / build / test / coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        node-version: ['24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          cache-dependency-path: backend-node/yarn.lock

      - name: Phase-3 migration allowlist guard
        run: |
          set -euo pipefail
          # Every /api/... route registration in backend-node/src/** MUST be
          # on the migration allowlist. Foundation stayed at zero registrations
          # (Phase 2B). Phase 3 opens this surface one route at a time; each
          # new route requires its Fastify path to appear verbatim in the
          # allowlist file.
          ALLOWLIST=".migration-allowlist"
          # Match any /api/... string literal ('...' or "...") in src/**.
          # This intentionally catches split-line route registrations too
          # (e.g. `.get<T>(<newline>  '/api/foo'`) which a single-line regex
          # would miss. False positives (e.g. string constants) are still
          # required to be on the allowlist.
          matches=$(grep -RnoE "['\"]/api/[^'\"]+['\"]" --include='*.ts' src 2>/dev/null || true)
          if [ -z "$matches" ]; then
            echo "OK: no /api/* route registration in backend-node/src."
            exit 0
          fi
          if [ ! -f "$ALLOWLIST" ]; then
            echo "::error::/api/* registration present in src/ but $ALLOWLIST is missing."
            exit 1
          fi
          # Load allowlist (strip comments + blanks).
          allow=$(grep -vE '^\s*(#|$)' "$ALLOWLIST" || true)
          if [ -z "$allow" ]; then
            echo "::error::$ALLOWLIST contains no entries but /api registrations exist in src/."
            exit 1
          fi
          # Gate 7t: registrations that are NOT Class-C cutover-eligible
          # (deferred write-on-GET shadows, parked writers, precedence guards)
          # are listed in .migration-deferred. A path may appear in exactly
          # one of the two files.
          DEFERRED=".migration-deferred"
          deferred=""
          if [ -f "$DEFERRED" ]; then
            deferred=$(grep -vE '^\s*(#|$)' "$DEFERRED" || true)
          fi
          both=$(printf '%s\n' "$allow" | grep -Fx -f <(printf '%s\n' "$deferred") || true)
          if [ -n "$deferred" ] && [ -n "$both" ]; then
            echo "::error::paths listed in BOTH $ALLOWLIST and $DEFERRED:"
            printf '%s\n' "$both"
            exit 1
          fi
          allow=$(printf '%s\n%s\n' "$allow" "$deferred")
          fail=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            route=$(printf '%s' "$line" | grep -oE "['\"]/api/[^'\"]+['\"]" | head -1 | sed -e "s/^['\"]//" -e "s/['\"]$//")
            if [ -z "$route" ]; then
              echo "::warning::could not extract route path from: $line"
              continue
            fi
            if ! printf '%s\n' "$allow" | grep -Fxq "$route"; then
              echo "::error::$line"
              echo "::error::route \"$route\" is NOT on the migration allowlist ($ALLOWLIST) or $DEFERRED."
              fail=1
            fi
          done <<< "$matches"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: all /api/* registrations in backend-node/src are on the migration allowlist."

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: TypeScript strict typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Vitest with coverage
        run: yarn test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-node-coverage
          path: backend-node/coverage
          if-no-files-found: warn
          retention-days: 14

      - name: Foundation smoke — confirm dist/ produced
        run: |
          test -f dist/app.js
          test -f dist/health.js
          test -f dist/server.js
          echo "OK: build artifacts present."
