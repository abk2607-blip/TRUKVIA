; TRUKVIA · Phase 4 · Gate 9f · supervisord program for the Node read backend.
;
; TEMPLATE — NOT ACTIVE. The Emergent pod's supervisord configuration
; (/etc/supervisor/conf.d, where the existing `backend` / `frontend` programs
; live) belongs to the platform image and is NOT part of this repository.
; Installing this program is a platform action (see
; docs/migration/PHASE4-GATE9F-CUTOVER-INFRA.md §7). Until it is installed Node
; does not run in production, and the Python router (default OFF) never
; forwards anything.
;
; Node listens on 127.0.0.1 only: the Python process is the sole client.
[program:backend-node]
command=/bin/sh /app/deploy/supervisor/run-backend-node.sh
directory=/app/backend-node
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/backend-node.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/backend-node.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
