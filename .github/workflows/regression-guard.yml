name: Regression Guard — block deploys on iter42-50 failure

# Iter51 — This workflow enforces that no deploy proceeds when the critical
# regression suite is broken. Add it as a Required Status Check on your
# `main` branch protection rules.

on:
  push:
    branches: [main, master, production]
  pull_request:
    branches: [main, master, production]
  workflow_dispatch:

jobs:
  regression-guard:
    name: Iter42-50 Regression Suite
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `emergentintegrations` is an Emergent RUNTIME package: the platform image
      # serves it, public PyPI does not. `pip install -r requirements.txt` therefore
      # cannot resolve it here and the job dies before a single test runs.
      #
      # backend/requirements.txt stays AUTHORITATIVE AND UNCHANGED — production needs
      # that pin — so CI installs from a filtered COPY. No other version is pinned,
      # and no private index or secret is introduced.
      - name: Install backend deps
        run: |
          cd backend
          pip install --upgrade pip
          CI_REQS="$(mktemp)"
          grep -v '^emergentintegrations==0\.2\.0[[:space:]]*$' requirements.txt > "$CI_REQS"
          pip install -r "$CI_REQS"
          rm -f "$CI_REQS"

      - name: Start backend (background)
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: regression_ci
          CORS_ORIGINS: "*"
          # Empty ON PURPOSE, and it is what makes the step above safe. The AI
          # routes check this key FIRST and answer 503 "AI is not configured"; only
          # a non-empty key reaches their lazy `emergentintegrations` import, which
          # would then be an uncaught ImportError and a 500. The regression suite
          # accepts 503 and asserts no real AI response, so CI deliberately
          # exercises the not-configured path instead of a real AI call.
          EMERGENT_LLM_KEY: ""
        run: |
          cd backend
          nohup uvicorn server:app --host 0.0.0.0 --port 8001 > /tmp/uvicorn.log 2>&1 &
          # Wait for the backend to answer
          for i in {1..30}; do
            curl -sf http://localhost:8001/api/auth/health && exit 0 || sleep 1
          done
          echo "Backend failed to start"; cat /tmp/uvicorn.log; exit 1

      - name: Run regression guard
        env:
          BACKEND_URL_INTERNAL: http://localhost:8001
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: regression_ci
        run: |
          bash backend/scripts/run_regression.sh

      - name: Run pre-deploy smoke (Trip + Halting E2E)
        env:
          BACKEND_URL: http://localhost:8001
        run: |
          bash backend/scripts/predeploy_check.sh

      - name: Upload deploy-readiness artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-readiness
          path: /tmp/deploy_readiness.json
          if-no-files-found: ignore

      - name: Fail the job on non-zero
        if: failure()
        run: |
          echo "::error::Regression guard blocked this deploy. See the pytest and predeploy_check output above."
          exit 1
